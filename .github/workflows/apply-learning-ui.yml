name: Add daily list pause setting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-learning-ui.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch application source
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Missing patch target: {label}')
              text = text.replace(old, new, 1)

          replace_once('''interface Settings {
  levels: HskLevel[];
  direction: Direction;
  speechRate: number;
}''', '''interface Settings {
  levels: HskLevel[];
  direction: Direction;
  speechRate: number;
  pauseDailyLists: boolean;
}''', 'Settings interface')

          replace_once('''const defaultSettings: Settings = {
  levels: [1],
  direction: "zh-nl",
  speechRate: 0.72,
};''', '''const defaultSettings: Settings = {
  levels: [1],
  direction: "zh-nl",
  speechRate: 0.72,
  pauseDailyLists: false,
};''', 'default settings')

          replace_once('''  useEffect(() => {
    setDailySets((current) => createDailySet(current, levelWords, settings.levels, DAILY_WORD_COUNT, progress));
  }, [levelWords, progress, settings.levels]);''', '''  useEffect(() => {
    if (settings.pauseDailyLists) return;
    setDailySets((current) => createDailySet(current, levelWords, settings.levels, DAILY_WORD_COUNT, progress));
  }, [levelWords, progress, settings.levels, settings.pauseDailyLists]);''', 'daily list generation')

          replace_once('''      <section className="settings-card">
        <label>
          <span><strong>Uitspraaksnelheid</strong><small>{Math.round(settings.speechRate * 100)}%</small></span>
          <input type="range" min="0.5" max="1" step="0.05" value={settings.speechRate} onChange={(event) => onChange({ speechRate: Number(event.target.value) })} />
        </label>
      </section>''', '''      <section className="settings-card">
        <label>
          <span><strong>Dagelijkse lijsten pauzeren</strong><small>{settings.pauseDailyLists ? "Gepauzeerd" : "Actief"}</small></span>
          <input
            type="checkbox"
            role="switch"
            checked={settings.pauseDailyLists}
            onChange={(event) => onChange({ pauseDailyLists: event.target.checked })}
          />
        </label>
        <p>Wanneer dit aanstaat, worden geen nieuwe daglijsten aangemaakt. Bestaande daglijsten en je voortgang blijven bewaard.</p>
      </section>
      <section className="settings-card">
        <label>
          <span><strong>Uitspraaksnelheid</strong><small>{Math.round(settings.speechRate * 100)}%</small></span>
          <input type="range" min="0.5" max="1" step="0.05" value={settings.speechRate} onChange={(event) => onChange({ speechRate: Number(event.target.value) })} />
        </label>
      </section>''', 'settings toggle')

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Add daily list pause toggle"
          git push
