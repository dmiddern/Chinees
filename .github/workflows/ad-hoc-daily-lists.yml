name: Ad hoc daily lists

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ad-hoc-daily-lists.yml
      - scripts/apply-ad-hoc-daily-lists.mjs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply changes
        run: node scripts/apply-ad-hoc-daily-lists.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/lib/dailySets.ts src/components/ListManager.tsx src/styles.css
          git commit -m "Make daily lists ad hoc"
          git push
