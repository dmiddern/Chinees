name: Remove Leren navigation tab

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-learning-tab.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove Leren from main navigation
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          target = '  { id: "learn", label: "Leren", icon: "学" },\n'
          if target in text:
              text = text.replace(target, '', 1)
          app.write_text(text)

          css = Path('src/styles.css')
          styles = css.read_text()
          styles = styles.replace('grid-template-columns: repeat(6, 1fr);', 'grid-template-columns: repeat(5, 1fr);', 1)
          css.write_text(styles)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/remove-learning-tab.yml
          git add src/App.tsx src/styles.css .github/workflows/remove-learning-tab.yml
          git commit -m "Remove Leren from bottom navigation"
          git push
